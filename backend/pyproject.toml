[project]
name = "surgeguard-backend"
version = "0.1.0"
description = "SurgeGuard core intelligence + backend (Member B)"
requires-python = ">=3.12"
dependencies = [
    # Version floors checked against current (Sept 2026) stable releases,
    # not written from memory -- see backend/README.md "Dependency
    # versions" for sources and the reasoning behind each one.
    "fastapi>=0.135",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.13",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.50,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.18",
    # Outbound call that hands approved recovery actions to n8n.
    "httpx>=0.27",
    # Gemini API client for the recovery-plan explanation layer.
    "google-genai>=1.0",
    # Argon2id password hashing (D-06). Floor verified against live PyPI
    # metadata on 2026-09-10: 0.3.1, released 2026-08-12, actively maintained.
    # The unmaintained, pre-2020 alternative most FastAPI tutorials still
    # copy was deliberately rejected (D-07) -- see INTEGRATION-NOTES.md #14.
    "pwdlib[argon2]>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection design *requires* Depends()/Query() as
# argument defaults -- that's the idiomatic pattern, not the
# "mutable default argument" footgun B008 exists to catch. Without this,
# ruff flags every single route handler in the project.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
