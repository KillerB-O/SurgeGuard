[project]
name = "surgeguard-simulator"
version = "0.1.0"
description = "Deterministic external-world simulator for SurgeGuard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "httpx>=0.27",
    "pydantic>=2.13",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
